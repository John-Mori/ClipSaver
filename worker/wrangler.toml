name = "clipsaver"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]


[vars]
# TikTokの直接経路が本番で弾かれた時だけ外部の公開API(tikdownloader)を使う。外すなら "" にする。
PUBLIC_API_FALLBACK = "tikdownloader"

[[ratelimits]]
name = "RESOLVE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
